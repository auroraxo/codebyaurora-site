name: Verify site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate embedded JavaScript syntax
        run: |
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("index.html", "utf8");
            const m = html.match(/<script>([\s\S]*?)<\/script>/);
            if (!m) throw new Error("No script block found in index.html");
            new Function(m[1]);
            console.log("Embedded JS parses cleanly");
          '
      - name: Check design invariants
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          t = Path("index.html").read_text()
          assert "releases/latest" in t, "Release button must link /releases/latest, not a pinned tag"
          assert "/status" in t, "API explorer must expose /status"
          assert "codebyaurora.com/simple/" in t, "Quickstart must link project package index"
          assert "data.cpu" not in t, "Must not reference stale collector schema (data.cpu)"
          assert "data.system" not in t, "Must not reference stale collector schema (data.system)"
          assert 'href="/solana-findings/"' in t, "Homepage must link the English findings URL"
          sitemap = Path("sitemap.xml").read_text()
          findings = Path("solana-findings/index.html").read_text()
          assert "https://codebyaurora.com/solana-findings/" in sitemap
          assert '<link rel="canonical" href="https://codebyaurora.com/solana-findings/">' in findings
          assert "/befund/" not in t + sitemap + findings, "Old URL must not be published as canonical"
          assert Path("solana-findings/evidence/issues-2026-10.json").is_file()
          print("All design invariants hold")
          EOF
      - name: Re-read every published status claim against GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Exit 1 = the page asserts something the live world no longer supports
        # (correct the page, do not weaken the claim).
        # Exit 2 = the claim could not be re-read; that is also a failure on
        # purpose, so a token or network problem can never be mistaken for a
        # clean check.
        run: node tools/check-claims.mjs
      - name: Re-read every published link (external + own routes)
        # Exit 1 = a link the page publishes no longer resolves (fix the page).
        # Exit 2 = a link could not be checked (bot wall, network) — also a
        # failure on purpose, so an unchecked link never counts as checked.
        run: node tools/check-links.mjs
